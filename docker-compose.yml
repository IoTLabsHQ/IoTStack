services:
  mosquitto:
    build:
      context: ./mosquitto
    container_name: iotstack-mosquitto
    restart: unless-stopped
    environment:
      DYNSEC_CONTROLLER_USERNAME: ${DYNSEC_CONTROLLER_USERNAME:-iotstack_controller}
      DYNSEC_CONTROLLER_PASSWORD: ${DYNSEC_CONTROLLER_PASSWORD:-changeme_generate_a_real_secret}
      MQTT_COLLECTOR_USERNAME: ${MQTT_COLLECTOR_USERNAME:-iotstack_collector}
      MQTT_COLLECTOR_PASSWORD: ${MQTT_COLLECTOR_PASSWORD:-changeme_generate_a_real_secret}
      MQTT_API_COMMAND_USERNAME: ${MQTT_API_COMMAND_USERNAME:-iotstack_api_command}
      MQTT_API_COMMAND_PASSWORD: ${MQTT_API_COMMAND_PASSWORD:-changeme_generate_a_real_secret}
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - mosquitto_conf.d:/mosquitto/conf.d
      - caddy_data:/certs:ro
      - iotstack_settings:/settings-shared:ro
    mem_limit: 128m
    networks:
      - iotstack

  api:
    build:
      context: ./api
    container_name: iotstack-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/iotstack.db
      MOSQUITTO_HOST: mosquitto
      MOSQUITTO_PORT: "1883"
      DYNSEC_CONTROLLER_USERNAME: ${DYNSEC_CONTROLLER_USERNAME:-iotstack_controller}
      DYNSEC_CONTROLLER_PASSWORD: ${DYNSEC_CONTROLLER_PASSWORD:-changeme_generate_a_real_secret}
      MQTT_COLLECTOR_USERNAME: ${MQTT_COLLECTOR_USERNAME:-iotstack_collector}
      MQTT_COLLECTOR_PASSWORD: ${MQTT_COLLECTOR_PASSWORD:-changeme_generate_a_real_secret}
      MQTT_API_COMMAND_USERNAME: ${MQTT_API_COMMAND_USERNAME:-iotstack_api_command}
      MQTT_API_COMMAND_PASSWORD: ${MQTT_API_COMMAND_PASSWORD:-changeme_generate_a_real_secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-changeme_generate_a_real_secret}
      RATE_LIMIT_MSG_PER_MIN: ${RATE_LIMIT_MSG_PER_MIN:-60}
      STORAGE_CAP_MB: ${STORAGE_CAP_MB:-500}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-14}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-4096}
      MAX_PAYLOAD_KEYS: ${MAX_PAYLOAD_KEYS:-32}
      MAX_PAYLOAD_DEPTH: ${MAX_PAYLOAD_DEPTH:-3}
      RESOURCE_POLL_INTERVAL_SECONDS: ${RESOURCE_POLL_INTERVAL_SECONDS:-30}
      DOMAIN: ${DOMAIN:-}
    volumes:
      - api_data:/data
      - iotstack_settings:/settings-shared
      - /run/iotstack-agent/agent.sock:/run/iotstack-agent.sock
    depends_on:
      - mosquitto
    mem_limit: 256m
    networks:
      - iotstack

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    container_name: iotstack-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m
    networks:
      - iotstack

volumes:
  mosquitto_data:
  mosquitto_log:
  mosquitto_conf.d:
  api_data:
  caddy_data:
  caddy_config:
  iotstack_settings:

networks:
  iotstack:
