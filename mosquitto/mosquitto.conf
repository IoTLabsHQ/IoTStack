persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

listener 1883
listener 9001
protocol websockets

# entrypoint.sh writes a TLS listener (port 8883) here once a certificate
# for DOMAIN exists — absent in local/no-domain setups, so mosquitto starts
# fine without one.
include_dir /mosquitto/conf.d
